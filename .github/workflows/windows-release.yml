name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.2.0)
        required: true
        default: v0.2.0

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build Windows app
        run: npm run package:windows
      - name: Archive portable app and checksum
        shell: pwsh
        run: |
          Copy-Item README.md dist/PikaDay-win32-x64/README-ko.md
          Rename-Item dist/PikaDay-win32-x64 PikaDay
          Compress-Archive -Path dist/PikaDay -DestinationPath dist/PikaDay-Windows-x64.zip
          Compress-Archive -Path assets/characters/*.png -DestinationPath dist/PikaDay-Transparent-Images.zip
          $digest = (Get-FileHash dist/PikaDay-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path dist/PikaDay-Windows-x64.sha256 -Value "$digest  PikaDay-Windows-x64.zip" -Encoding ascii
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release tag' }
          gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:RELEASE_REPO --verify-tag --title "피카 데이 $env:RELEASE_TAG" --notes-file .github/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $env:RELEASE_TAG dist/PikaDay-Windows-x64.zip dist/PikaDay-Windows-x64.sha256 dist/PikaDay-Transparent-Images.zip --repo $env:RELEASE_REPO --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
