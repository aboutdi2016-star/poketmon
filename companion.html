<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>피카 데이 · 작은 패널</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:'Segoe UI','Malgun Gothic',sans-serif;color:#343b2d;font-size:13px}body{padding:8px 16px 18px 8px}.arrow-left{padding:8px 8px 18px 16px}.arrow-left .card:after{right:auto;left:-6px;transform:rotate(225deg)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #baa12b;outline-offset:2px}[hidden]{display:none!important}.card{background:#fffef7;border:1px solid #e2e6d5;border-radius:20px;box-shadow:0 4px 12px #1d261c25;position:relative;padding:17px;height:414px;display:flex;flex-direction:column}.card:after{content:'';position:absolute;bottom:12px;right:-8px;width:14px;height:14px;background:#fffef7;border-right:1px solid #e2e6d5;border-top:1px solid #e2e6d5;transform:rotate(45deg)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}h1{font-size:15px;margin:0}h2{font-size:13px;margin:0}.close{border:0;background:transparent;color:#929a83;font-size:20px;width:26px;height:26px}.sub{color:#8b947c;font-size:11px;margin:3px 0 0}.tabs{display:flex;gap:5px;border-bottom:1px solid #e9ebdf;margin-top:10px}.tabs select{border:0;background:transparent;color:#818970;max-width:66px}.tabs button{border:0;background:transparent;padding:9px 10px;color:#818970}.tabs button.active{border-bottom:2px solid #d2b82e;color:#343b2d;font-weight:700}.scroll{overflow:auto;flex:1;min-height:0;padding-top:7px}.task{display:flex;gap:9px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #f0f1e8}.task input{margin:2px 0;accent-color:#b39b28}.task .task-label{flex:1;line-height:1.45;overflow-wrap:anywhere}.task.done .task-label{color:#a2a894;text-decoration:line-through}.priority{font-size:10px;border-radius:5px;background:#fff0ca;padding:3px 5px;color:#9a7733}.p2{background:#eff2e8;color:#798467}.source{font-size:10px;color:#a1a78f;display:block;margin-top:2px}.empty{color:#8c947b;text-align:center;padding:28px 10px;line-height:1.7}.meeting{padding:10px 0;border-bottom:1px solid #eff1e5;display:flex;align-items:center;gap:10px}.meeting div{flex:1;overflow-wrap:anywhere}.join,.primary{border:0;border-radius:9px;background:#ffe064;color:#514a25;padding:8px 10px;font-weight:600;white-space:nowrap}.progress{height:5px;background:#ecefdf;border-radius:5px;margin:10px 0 5px;overflow:hidden}.progress span{display:block;height:100%;background:#d6bd39;border-radius:5px}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.quiet{background:transparent;border:0;color:#7d866a;font-size:11px;padding:6px}.add{display:flex;gap:5px;margin-top:9px}.add input{width:0;flex:1;border:1px solid #e3e6d7;border-radius:8px;padding:7px;min-width:0}.add select{border:1px solid #e3e6d7;border-radius:8px;background:#fffef7}.add button{padding:7px 9px}#feedback{height:14px;font-size:10px;color:#82784c;margin-top:4px}#bubble{height:auto;min-height:120px;max-height:178px}#bubble h1{font-size:14px;line-height:1.5;margin-right:5px}#bubble header{align-items:flex-start;margin-bottom:5px}#bubble p{font-size:12px;line-height:1.6;margin:0 0 8px;overflow-wrap:anywhere;overflow:auto}#bubble .footer{margin-top:0}
</style></head><body>
<section id="panel" class="card" hidden><header><div><h1>⚡ 오늘의 작은 한 걸음</h1><p id="counts" class="sub"></p></div><button class="close" id="close-panel" aria-label="패널 닫기">×</button></header><div class="progress"><span id="fill"></span></div><p id="progress" class="sub"></p><nav class="tabs"><select id="day-filter" aria-label="할 일 날짜 필터"><option value="all">전체</option><option value="today">오늘</option><option value="core">핵심 3</option></select><button id="tab-tasks" class="active">할 일</button><button id="tab-meetings">회의</button></nav><form id="quick-note-form" hidden><label for="quick-note-text">빠른 메모 · Obsidian</label><textarea id="quick-note-text" maxlength="10000" required rows="4" style="width:100%;resize:vertical" placeholder="생각나는 내용을 적어 주세요"></textarea><button class="primary" type="submit">메모 저장</button><button class="quiet" id="note-cancel" type="button">취소</button></form><div id="tasks" class="scroll"></div><div id="meetings" class="scroll" hidden></div><form id="add-form" class="add"><input id="title" maxlength="140" required placeholder="할 일 하나 적기" aria-label="새 할 일"><button class="primary" type="submit">추가</button></form><span id="feedback" role="status"></span><div class="footer"><button class="quiet" id="daily-summary">하루 요약 저장</button></div><footer class="footer"><button class="quiet" id="quick-note">메모</button><button class="quiet" id="sync">↻ 지금 수집</button><button class="quiet" id="details">전체 화면 ↗</button><button class="quiet" id="settings">설정</button></footer></section>
<section id="bubble" class="card" hidden role="status"><header><h1 id="bubble-title"></h1><button class="close" id="close-bubble" aria-label="말풍선 닫기">×</button></header><p id="bubble-body"></p><footer class="footer"><button class="quiet" id="bubble-snooze">10분 뒤</button><button class="quiet" id="bubble-panel">오늘의 할 일 보기</button><button class="join" id="bubble-join" hidden>회의 참가 ↗</button></footer></section><script src="/day.js"></script><script src="/companion.js"></script></body></html>
